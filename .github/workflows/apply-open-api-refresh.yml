name: Apply Open API page refresh

on:
  push:
    paths:
      - '.github/workflows/apply-open-api-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh API pages
        run: python scripts/refresh_open_api_pages.py

      - name: Commit generated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype-v4/index.html
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "feat: align Open API pages with release gateway"
          git push origin HEAD:main

# one-time bootstrap trigger; future runs can use workflow_dispatch
