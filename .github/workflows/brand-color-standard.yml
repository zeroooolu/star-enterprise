name: Brand color standard

on:
  push:
  pull_request:

jobs:
  check-brand-colors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Reject unapproved blue colors
        run: node scripts/check-brand-colors.mjs
