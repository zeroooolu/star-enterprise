name: Apply Open API page styles

on:
  push:
    paths:
      - '.github/workflows/apply-open-api-styles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply styles
        run: python scripts/append_open_api_styles.py
      - name: Commit styles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype-v4/styles.css
          if git diff --cached --quiet; then
            echo "No style changes."
            exit 0
          fi
          git commit -m "style: restore Open API page layout"
          git push origin HEAD:main
