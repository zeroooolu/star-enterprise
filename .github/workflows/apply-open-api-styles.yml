name: Apply Open API page styles

on:
  push:
    paths:
      - '.github/workflows/apply-open-api-styles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append Open API styles
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('prototype-v4/styles.css')
          css = path.read_text(encoding='utf-8')
          marker = '/* Open API V1 page */'
          if marker not in css:
              css += r'''

/* Open API V1 page */
[data-page="api"]{--api-blue:#315ff4;--api-ink:#111827}
[data-page="api"] p{text-wrap:pretty}
[data-page="api"] .api-hero{position:relative;overflow:hidden;padding-bottom:82px;background:radial-gradient(circle at 82% 18%,rgba(49,95,244,.13),transparent 31%),linear-gradient(180deg,#fff 0%,#f7f9ff 100%)}
[data-page="api"] .api-hero:after{content:"";position:absolute;right:-120px;bottom:-180px;width:460px;height:460px;border:1px solid rgba(49,95,244,.09);border-radius:50%;box-shadow:0 0 0 70px rgba(49,95,244,.025),0 0 0 140px rgba(49,95,244,.015);pointer-events:none}
[data-page="api"] .api-hero .container{position:relative;z-index:1}
[data-page="api"] .api-hero p{max-width:800px;font-size:17px;line-height:1.82}
[data-page="api"] .api-hero-proof{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
[data-page="api"] .api-hero-proof span{display:inline-flex;align-items:center;padding:8px 12px;border:1px solid rgba(49,95,244,.14);border-radius:999px;background:rgba(255,255,255,.82);color:#3d56a7;font-size:11px;font-weight:800}
[data-page="api"] .api-subnav{position:sticky;top:72px;z-index:45;border-bottom:1px solid #e7ebf2;background:rgba(255,255,255,.94);backdrop-filter:blur(16px)}
[data-page="api"] .api-subnav .container{display:flex;gap:28px;overflow:auto;scrollbar-width:none}
[data-page="api"] .api-subnav a{flex:none;padding:16px 0;color:#748095;font-size:12px;font-weight:700;white-space:nowrap;border-bottom:2px solid transparent}
[data-page="api"] .api-subnav a:hover{color:var(--api-ink);border-color:var(--api-blue)}
[data-page="api"] .section{scroll-margin-top:128px}
[data-page="api"] .api-flow-section .section-head p{color:#98a5ba}
[data-page="api"] .api-dev-grid{gap:14px}
[data-page="api"] .api-dev-grid article{min-height:185px;border-radius:17px;box-shadow:0 9px 28px rgba(26,42,82,.035)}
[data-page="api"] .api-dev-grid article>b{color:#7184c4;font-size:9px;letter-spacing:.08em}
[data-page="api"] .api-dev-grid h3{font-size:18px;margin-top:18px}
[data-page="api"] .api-dev-grid p{line-height:1.7}
[data-page="api"] .api-doc-row{display:flex;align-items:center;justify-content:space-between;gap:28px;margin-top:18px;padding:21px 24px;border:1px solid #dfe5ef;border-radius:15px;background:#fff}
[data-page="api"] .api-doc-row b,[data-page="api"] .api-doc-row span{display:block}
[data-page="api"] .api-doc-row b{font-size:13px}
[data-page="api"] .api-doc-row span{margin-top:4px;color:#7a8698;font-size:11px}
[data-page="api"] .api-method-grid{grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
[data-page="api"] .api-method-grid>div{position:relative;min-height:164px;padding:23px 20px;border-radius:16px;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
[data-page="api"] .api-method-grid>div:hover{transform:translateY(-2px);border-color:#ccd7ed;box-shadow:0 13px 32px rgba(28,44,81,.06)}
[data-page="api"] .api-method-grid>div.primary{border-color:#adc0ff;background:linear-gradient(180deg,#f5f8ff,#fff)}
[data-page="api"] .api-method-grid small{display:block;margin-bottom:18px;color:#8a98ac;font-size:8px;font-weight:900;letter-spacing:.1em}
[data-page="api"] .api-method-grid b{font-size:18px}
[data-page="api"] .api-method-grid span{margin-top:9px;font-size:11px;line-height:1.65}
[data-page="api"] .api-commercial-section{padding-top:88px;padding-bottom:88px}
[data-page="api"] .api-commercial-card{display:grid;grid-template-columns:1.15fr 1fr auto;gap:34px;align-items:center;padding:30px 32px;border:1px solid #dce3ed;border-radius:20px;background:#fff;box-shadow:0 18px 48px rgba(26,42,82,.06)}
[data-page="api"] .api-commercial-prices{display:flex;align-items:center;gap:22px}
[data-page="api"] .api-commercial-prices>div>span{display:block;color:#7b8798;font-size:10px}
[data-page="api"] .api-commercial-prices strong{display:block;margin-top:7px;color:#172137;font-size:31px;letter-spacing:-.04em;white-space:nowrap}
[data-page="api"] .api-commercial-prices small{font-size:12px;color:#7c8798;margin-left:3px}
[data-page="api"] .api-commercial-prices>i{color:#a4afbf;font-style:normal;font-size:20px}
[data-page="api"] .api-commercial-includes{display:grid;gap:8px}
[data-page="api"] .api-commercial-includes span{color:#657184;font-size:11px;line-height:1.5}
[data-page="api"] .api-commercial-includes span:before{content:"✓";margin-right:8px;color:var(--api-blue);font-weight:900}
[data-page="api"] .api-commercial-actions{display:flex;flex-direction:column;align-items:flex-start;gap:12px;min-width:145px}
[data-page="api"] .api-commercial-actions .btn{width:100%}
[data-page="api"] .api-commercial-note{grid-column:1/-1;margin:0;padding-top:16px;border-top:1px solid #edf0f5;color:#8792a3;font-size:12px;line-height:1.65}
@media(max-width:1050px){[data-page="api"] .api-method-grid{grid-template-columns:repeat(3,1fr)}[data-page="api"] .api-commercial-card{grid-template-columns:1fr 1fr}[data-page="api"] .api-commercial-actions{grid-column:1/-1;flex-direction:row}[data-page="api"] .api-commercial-actions .btn{width:auto!important}}
@media(max-width:820px){[data-page="api"] .api-subnav{top:64px}[data-page="api"] .api-flow article{padding-right:18px}[data-page="api"] .api-method-grid{grid-template-columns:repeat(2,1fr)}[data-page="api"] .api-commercial-card{grid-template-columns:1fr}[data-page="api"] .api-commercial-actions{grid-column:auto}[data-page="api"] .api-doc-row{align-items:flex-start;flex-direction:column}}
@media(max-width:560px){[data-page="api"] .api-hero-proof{gap:7px}[data-page="api"] .api-subnav .container{gap:20px}[data-page="api"] .api-method-grid{grid-template-columns:1fr}[data-page="api"] .api-commercial-card{padding:24px 20px}[data-page="api"] .api-commercial-prices{align-items:flex-start;flex-direction:column;gap:12px}[data-page="api"] .api-commercial-prices>i{display:none}[data-page="api"] .api-commercial-actions{width:100%}[data-page="api"] .api-commercial-actions .btn{width:100%!important}}
'''
              path.write_text(css, encoding='utf-8')
          PY
      - name: Commit styles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype-v4/styles.css
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: restore Open API page layout"
          git push origin HEAD:main
