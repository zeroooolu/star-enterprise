name: Apply developer center restructure

on:
  push:
    paths:
      - 'scripts/restructure_developer_center.py'
      - '.github/workflows/apply-developer-center-restructure.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restructure developer center
        run: python scripts/restructure_developer_center.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype-v4/index.html prototype-v4/styles.css
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "feat: restructure Chinese developer center"
          git push origin HEAD:main
