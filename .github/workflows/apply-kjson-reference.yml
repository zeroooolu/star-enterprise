          {
            "id": "string", // dspid
            "artistDspId": "string", // dsp下艺人id
            "linkName": "string", // dsp名称
            "linkUrl": "string", // dsp
            "type": "string",
            "isNew": "string"
          }
        ],
        "translate": [
          {
            "languageScriptCode": "string",
            "name": "string",
            "applicableTerritoryCode": "string"
          }
        ],
        "label": [
          {
            "id": "string",
            "name": "string"
          }
        ]
      }
    }
  ]
}</code></pre>
          </div>
        </details>

        <details class="kjson-part" id="kjson-release">
          <summary><span><b>第五部分</b><strong>ReleaseList · 发行信息</strong><small>目标 DSP、发行日期 / 时间、地区、有效期、商业模式与 Usage。</small></span><i>展开查看完整字段与示例</i></summary>
          <div class="kjson-part-body">
            <div class="kjson-field-table">
              <div class="head"><b>字段</b><b>要求</b><b>说明</b></div>
              <div><code>id / name</code><span>必填</span><p>DSP 主键 ID 与名称。</p></div>
              <div><code>releaseDate</code><span>必填</span><p>发行日期，格式 <code>yyyy-MM-dd</code>。</p></div>
              <div><code>releaseTime</code><span>可选</span><p>发行时间，格式 <code>HH:mm:ss</code>。</p></div>
              <div><code>territoryCodes</code><span>必填</span><p>发行地区 code 数组，例如 <code>CN</code>、<code>TW</code>。</p></div>
              <div><code>validtyPeriod</code><span>必填</span><p>原文拼写为 <code>validtyPeriod</code>，包含开始时间与结束时间。</p></div>
              <div><code>CommercialModelTypes</code><span>必填</span><p>付费方式 code。</p></div>
              <div><code>Usage</code><span>必填</span><p>原文注释同样写作“付费方式”，字段值为 code。</p></div>
            </div>
            <pre class="kjson-code"><code>{
  "dsps": [
    {
      "id": 0, // 主键id【必填】
      "name": "", // 名称【必填】
      "releaseDate": "", // 发行日期 yyyy-MM-dd【必填】
      "releaseTime": "", // 发行时间 HH:mm:ss
      "territoryCodes": [
        "CN",
        "TW"
      ], // 地区code【必填】
      "validtyPeriod": {
        "startDate": "", // 开始时间 yyyy-MM-dd hh:mm:ss【必填】
        "endDate": "" // 结束时间 yyyy-MM-dd hh:mm:ss【必填】
      },
      "CommercialModelTypes": [
        {
          "code": "" // 付费code【必填】
        }
      ],
      "Usage": [
        {
          "code": "" // 付费code【必填】
        }
      ]
    }
  ]
}</code></pre>
          </div>
        </details>

        <div class="kjson-end-note"><b>如何使用这份结构</b><p>标准资源 API 客户通常无需手工拼装整份 K-JSON；系统会根据艺人、专辑、歌曲、文件和发行对象生成底层 K-JSON。需要批量发行或高级系统级接入时，可直接按照本节 V0.3.1 结构生成文件，再通过 STS / OSS / K-JSON 任务链路提交。</p></div>
      </section>

      '''

          html = html[:start] + new_section + html[end:]
          index_path.write_text(html, encoding='utf-8')

          marker = '/* K-JSON full reference */'
