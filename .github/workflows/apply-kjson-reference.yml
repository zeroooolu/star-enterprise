name: Apply full K-JSON reference docs

on:
  push:
    paths:
      - '.github/workflows/apply-kjson-reference.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand K-JSON developer documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          index_path = Path('prototype-v4/index.html')
          style_path = Path('prototype-v4/styles.css')
          html = index_path.read_text(encoding='utf-8')
          css = style_path.read_text(encoding='utf-8')

          start = html.index('<section id="guide-kjson">')
          end = html.index('<section id="webhooks">', start)

          new_section = r'''<section id="guide-kjson" class="kjson-reference">
        <div class="dev-section-kicker">发行指南</div>
        <div class="kjson-title-row"><div><h2>K-JSON V0.3.1</h2><p>K-JSON 是看见发行链路使用的完整发行数据格式，适用于批量发行、大规模曲库迁移和高级系统级对接。本节按原始 V0.3.1 文档完整整理字段、规则、枚举与示例。</p></div><span class="kjson-version-badge">当前文档版本 V0.3.1</span></div>

        <div class="kjson-source-note"><b>文档说明</b><p>原 PDF 的“简介”写作“分为 4 部分”，但实际列出并在后文详细定义了 5 个部分；本页面按实际的五部分结构展示。另，MessageHeader 示例中的 <code>kanjianVersion</code> 注释写明“当前版本为 v0.1.3”，与文档标题 V0.3.1 不是同一个版本字段，本页面保持原文，不做改写。</p></div>

        <div class="kjson-version-features">
          <h3>V0.3.1 版本特性</h3>
          <div class="kjson-feature-grid">
            <article><b>01</b><span>新增艺人在 DSP 主页数据</span><small>发行需求使用。</small></article>
            <article><b>02</b><span>优化 ResourceList 中艺人重复展示</span><small>ResourceList 只保留艺人与角色的关联关系，仅显示艺人名称和艺人 ID；艺人翻译信息、厂牌信息进入艺人基础数据。</small></article>
            <article><b>03</b><span>第四部分调整为艺人基础数据</span><small>包含 DSP 主页、翻译信息与厂牌信息。</small></article>
            <article><b>04</b><span>新增第五部分发行信息</span><small>原发行信息独立为 ReleaseList。</small></article>
            <article><b>05</b><span>删除 displayArtist 的翻译结构</span><small>原文备注为“字符串”。实际示例仍使用 <code>defaultTitle</code> 结构，页面两处均按原文保留。</small></article>
            <article><b>06</b><span>关联关系新增艺人 ID</span><small>ResourceList 中主要艺人、合作艺人、贡献者均带艺人 ID。</small></article>
          </div>
        </div>

        <div class="kjson-parser-note"><span>整体解析流程</span><b>Kazoo-标准K-JSON解析工具</b><small>原 PDF 引用了语雀内容卡片，但当前 PDF 解析结果未包含可直接访问的链接地址，因此此处仅保留工具名称。</small></div>

        <nav class="kjson-local-nav" aria-label="K-JSON 文档结构">
          <a href="#kjson-message-header"><b>01</b><span>MessageHeader</span><small>发送信息</small></a>
          <a href="#kjson-state"><b>02</b><span>传输类型</span><small>内容与 DSP 动作</small></a>
          <a href="#kjson-resource"><b>03</b><span>ResourceList</span><small>资源与作品元数据</small></a>
          <a href="#kjson-artist"><b>04</b><span>ArtistList</span><small>艺人基础数据</small></a>
          <a href="#kjson-release"><b>05</b><span>ReleaseList</span><small>发行与 DSP 信息</small></a>
        </nav>

        <details class="kjson-part" id="kjson-message-header" open>
          <summary><span><b>第一部分</b><strong>MessageHeader · 主要发送信息</strong><small>租户、内容提供方、作品、任务、发送方 / 接收方、消息类型等。</small></span><i>展开 / 收起</i></summary>
          <div class="kjson-part-body">
            <div class="kjson-field-table">
              <div class="head"><b>字段</b><b>要求</b><b>说明</b></div>
              <div><code>tenantKey</code><span>必填</span><p>租户 key。</p></div>
              <div><code>contentProviderName</code><span>必填</span><p>CP 名称。</p></div>
              <div><code>kanjianVersion</code><span>必填</span><p>看见标准版本；原文注释“当前版本为 v0.1.3”。</p></div>
              <div><code>objectPath</code><span>待确认</span><p>对象存储路径；原文标记“不确定、研发确认”。</p></div>
              <div><code>upc</code><span>必填</span><p>UPC。</p></div>
              <div><code>bucket</code><span>待确认</span><p>桶名称；原文标记“不确定、研发确认”。</p></div>
              <div><code>productKey</code><span>必填</span><p>作品 ID。</p></div>
              <div><code>messageThreadId</code><span>必填</span><p>本次出入库任务 ID，并作为输出文件名称。</p></div>
              <div><code>messageCreatedDateTime</code><span>必填</span><p>本次信息生成时间。</p></div>
              <div><code>messageControlType</code><span>必填</span><p><code>TestMessage</code> 代表测试，<code>LiveMessage</code> 代表正式推送。</p></div>
            </div>
            <div class="kjson-code-label"><b>完整示例结构</b><span>示例保留原文注释，因此不是可直接解析的标准 JSON。</span></div>
            <pre class="kjson-code"><code>{
  "tenantKey": "", // 租户key【必填】
  "contentProviderName": "", // cpName【必填】
  "kanjianVersion": "", // 看见标准版本【必填，当前版本为v0.1.3】
  "objectPath": "", // 对象存储路径【不确定、研发确认】
  "upc": "", // upc【必填】
  "bucket": "", // 桶名称【不确定、研发确认】
  "productKey": "", // 作品id【必填】
  "messageThreadId": "", // 对应本次出入库的任务id -> 输出的文件名称【必填】
  "messageSender": {
    "partyId": "", // 发送方id
    "partyName": {
      "fullName": "" // 名称【必填，租户key】
    }
  },
  "messageRecipient": [
    {
      "partyId": "", // 接收方id
      "partyName": {
        "fullName": "" // 名称【必填，给星发的写死kanjian-star】
      }
    }
  ],
  "sentOnBehalfOf": {
    "partyId": "", // cpid
    "partyName": {
      "fullName": "" // 名称【必填，租户的cp名称】
    }
  },
  "messageCreatedDateTime": "", // 本次信息生成时间【必填】
  "messageControlType": "", // TestMessage / LiveMessage【必填】
  "ddexVersion": "", // ddex传输版本
  "languageAndScriptCode": "" // ddex头的语言信息
}</code></pre>
          </div>
        </details>

        <details class="kjson-part" id="kjson-state" open>
          <summary><span><b>第二部分</b><strong>传输类型</strong><small>分别控制内容新增 / 更新，以及 DSP 上架 / 下架 / 全部下架。</small></span><i>展开 / 收起</i></summary>
          <div class="kjson-part-body">
            <pre class="kjson-code"><code>{
  "ContentState": "", // 内容新增、更新、无【必填】
  "DigitalServiceProviderState": "" // 上架、下架、全部下架、无【必填】
}</code></pre>

            <div class="kjson-state-map">
              <div><b>内容</b><span>新增 <code>INSERT</code></span><span>更新 <code>UPDATE</code></span><span>无 <code>NULL</code></span></div>
              <div><b>DSP 上下架</b><span>上架 <code>RELEASE</code></span><span>下架 <code>TAKE_DOWN</code></span><span>全部下架 <code>TAKE_DOWN_ALL</code></span><span>无 <code>NULL</code></span></div>
            </div>

            <div class="doc-table kjson-rule-table"><div class="head"><b>维度</b><b>操作</b><b>字段</b><b>枚举值</b><b>原文标记</b></div><div><span>内容</span><span>新增</span><code>ContentStateEnum</code><code>INSERT</code><span>1234（部分）</span></div><div><span>内容</span><span>更新</span><code>ContentStateEnum</code><code>UPDATE</code><span>1234</span></div><div><span>内容</span><span>无</span><code>ContentStateEnum</code><code>NULL</code><span>-</span></div><div><span>DSP</span><span>上架</span><code>DigitalServiceProviderState</code><code>RELEASE</code><span>1234</span></div><div><span>DSP</span><span>下架</span><code>DigitalServiceProviderState</code><code>TAKE_DOWN</code><span>124</span></div><div><span>DSP</span><span>全部下架</span><code>DigitalServiceProviderState</code><code>TAKE_DOWN_ALL</code><span>1 2 3</span></div><div><span>DSP</span><span>无</span><code>DigitalServiceProviderState</code><code>NULL</code><span>12</span></div></div>
            <p class="caption">PDF 的规则表包含 “1234 / 124 / 1 2 3 / 12” 等未定义数字标记，源文档未解释其业务含义，因此页面仅作为“原文标记”保留，不做推断。</p>

            <div class="kjson-two-code">
              <div><div class="kjson-code-label"><b>内容枚举</b></div><pre class="kjson-code"><code>public enum ContentStateEnum {
  INSERT("INSERT", "新增"),
  UPDATE("UPDATE", "更新"),
  NULL("NULL", "无");

  private final String name;
  private final String description;
}</code></pre></div>
              <div><div class="kjson-code-label"><b>DSP 枚举</b></div><pre class="kjson-code"><code>public enum DigitalServiceProviderStateEnum {
  NULL("NULL", "未知"),
  RELEASE("RELEASE", "上架"),
  TAKE_DOWN("TAKE_DOWN", "下架"),
  TAKE_DOWN_ALL("TAKE_DOWN_ALL", "全部下架");

  private final String name;
  private final String description;
}</code></pre></div>
            </div>
          </div>
        </details>

        <details class="kjson-part" id="kjson-resource">
          <summary><span><b>第三部分</b><strong>ResourceList · 资源列表</strong><small>资产与作品元数据，包括标题、ISRC / UPC、艺人角色、风格、厂牌、音频、封面与版权信息。</small></span><i>展开查看完整字段与示例</i></summary>
          <div class="kjson-part-body">
            <div class="kjson-object-overview"><article><b>assets</b><span>歌曲 / 音效 / 采样 / Beats / MV / 词曲等资产对象。</span></article><article><b>product</b><span>专辑、单曲专辑、EP、音乐视频、商用素材等作品对象。</span></article></div>
            <div class="kjson-code-label"><b>完整 ResourceList 示例</b><span>按 PDF 第 5-9 页合并为一个连续结构，字段名与注释保持原文。</span></div>
            <pre class="kjson-code kjson-code-large"><code>{
  "assets": [
    {
      "id": 0, // 主键id【必填】
      "title": {
        "defaultTitle": "", // 默认标题【必填】
