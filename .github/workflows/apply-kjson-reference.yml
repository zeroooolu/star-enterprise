        <details class="kjson-part" id="kjson-artist">
          <summary><span><b>第四部分</b><strong>ArtistList · 艺人基础信息</strong><small>艺人 ID、DSP 主页、翻译信息与厂牌信息。</small></span><i>展开查看完整字段与示例</i></summary>
          <div class="kjson-part-body">
            <div class="kjson-object-overview"><article><b>dsp</b><span>各 DSP 下的艺人主页 ID、名称、链接、类型及是否新建。</span></article><article><b>translate</b><span>艺人多语种名称及适用地区。</span></article><article><b>label</b><span>艺人关联的一个或多个厂牌。</span></article></div>
            <pre class="kjson-code"><code>{
