name: Apply API page Chinese refinement

on:
  push:
    paths:
      - 'scripts/refine_api_page_chinese.py'
      - '.github/workflows/apply-api-page-chinese.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine API page
        run: python scripts/refine_api_page_chinese.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prototype-v4/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: align API overview with Chinese developer docs"
          git push origin HEAD:main
