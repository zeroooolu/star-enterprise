# 顶层 user / pid / worker 等指令由基础镜像自带的 /etc/nginx/nginx.conf 提供，
# 本文件只作为 conf.d/default.conf 覆盖 http 段与 server 段。
# 端口、非 root 运行、文件属主等与环境相关的部分在 Dockerfile 中生成，见该文件注释。

# nginx 默认把临时文件放在 conf 同级前缀（/etc/nginx/*_temp）下；容器以非 root 运行时
# 无法写入 /etc/nginx，且该目录在只读根文件系统下不可写。全部改到 /tmp（mode 1777）。
client_body_temp_path /tmp/client_temp;
proxy_temp_path       /tmp/proxy_temp;
fastcgi_temp_path     /tmp/fastcgi_temp;
uwsgi_temp_path       /tmp/uwsgi_temp;
scgi_temp_path        /tmp/scgi_temp;

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 平台 logo 由上游仓库提供，用反向代理而不是本地副本，避免品牌素材进入仓库。
    # 变量 + resolver 让域名在请求时解析：上游不可达只影响这一个 location，不会导致 nginx 启动失败。
    location ~ ^/assets/platform-logos/(?<logo>[A-Za-z0-9][A-Za-z0-9._-]*)$ {
        resolver 127.0.0.11 223.5.5.5 8.8.8.8 valid=300s ipv6=off;
        set $logo_base "https://raw.githubusercontent.com/zeroooolu/music-promotion/main/frontend/star-release/assets/platform-logos";
        proxy_pass $logo_base/$logo;
        proxy_ssl_server_name on;
        proxy_set_header Host raw.githubusercontent.com;
        proxy_hide_header Set-Cookie;
        expires 1d;
    }

    # 企业后台入口：/enterprise/admin*
    location ~ ^/enterprise/admin(?:/(?:index\.html|plan|usage|company|brand))?/?$ {
        try_files /enterprise-admin/index.html =404;
    }

    # 官网首页
    location = / {
        try_files /prototype-v4/index.html =404;
    }

    # 官网其余入口：/enterprise*
    location ~ ^/enterprise(?:/(?:index\.html|product|solutions|pricing|api|developers|apply))?/?$ {
        try_files /prototype-v4/index.html =404;
    }

    # 只发布这两个目录，其余路径保持 404（不做 SPA 兜底，避免错误 URL 返回 200）
    location /prototype-v4/ {
        expires -1;
    }

    location /enterprise-admin/ {
        expires -1;
    }

    location / {
        return 404;
    }
}
