# 顶层 user / pid / worker 等指令由基础镜像自带的 /etc/nginx/nginx.conf 提供，
# 本文件只作为 conf.d/default.conf 覆盖 http 段与 server 段。

client_body_temp_path /tmp/client_temp;
proxy_temp_path       /tmp/proxy_temp;
fastcgi_temp_path     /tmp/fastcgi_temp;
uwsgi_temp_path       /tmp/uwsgi_temp;
scgi_temp_path        /tmp/scgi_temp;

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 平台 logo 由上游仓库提供。
    location ~ ^/assets/platform-logos/(?<logo>[A-Za-z0-9][A-Za-z0-9._-]*)$ {
        resolver 127.0.0.11 223.5.5.5 8.8.8.8 valid=300s ipv6=off;
        set $logo_base "https://raw.githubusercontent.com/zeroooolu/music-promotion/main/frontend/star-release/assets/platform-logos";
        proxy_pass $logo_base/$logo;
        proxy_ssl_server_name on;
        proxy_set_header Host raw.githubusercontent.com;
        proxy_hide_header Set-Cookie;
        expires 1d;
    }

    # 对外只暴露语义化资源路径，内部构建目录名不会出现在浏览器地址中。
    location = /assets/styles.css { alias /usr/share/nginx/html/prototype-v4/styles.css; }
    location = /assets/kjson-reference.js { alias /usr/share/nginx/html/prototype-v4/kjson-reference.js; }
    location = /assets/kjson-reference.css { alias /usr/share/nginx/html/prototype-v4/kjson-reference.css; }
    location = /assets/kjson-reference.html { alias /usr/share/nginx/html/prototype-v4/kjson-reference.html; }
    location = /assets/admin.css { alias /usr/share/nginx/html/enterprise-admin/styles.css; }
    location /assets/platforms/ { alias /usr/share/nginx/html/prototype-v4/assets/platform-logos/; }
    location /assets/ { alias /usr/share/nginx/html/prototype-v4/assets/; }

    # 新的官网与后台路由。
    location = / { try_files /prototype-v4/index.html =404; }
    # 这些语义化 URL 没有 .html 扩展名，Nginx 无法从 URI 推断 MIME 类型。
    # 明确返回 text/html，避免 Safari 刷新子页面时将响应作为文件下载。
    location = /product { default_type text/html; alias /usr/share/nginx/html/prototype-v4/index.html; }
    location = /solutions { default_type text/html; alias /usr/share/nginx/html/prototype-v4/index.html; }
    location = /pricing { default_type text/html; alias /usr/share/nginx/html/prototype-v4/index.html; }
    location = /api { default_type text/html; alias /usr/share/nginx/html/prototype-v4/index.html; }
    location = /developers { default_type text/html; alias /usr/share/nginx/html/prototype-v4/index.html; }
    location = /apply { default_type text/html; alias /usr/share/nginx/html/prototype-v4/index.html; }
    location = /admin { default_type text/html; alias /usr/share/nginx/html/enterprise-admin/index.html; }
    location = /admin/plan { default_type text/html; alias /usr/share/nginx/html/enterprise-admin/index.html; }
    location = /admin/usage { default_type text/html; alias /usr/share/nginx/html/enterprise-admin/index.html; }
    location = /admin/company { default_type text/html; alias /usr/share/nginx/html/enterprise-admin/index.html; }
    location = /admin/brand { default_type text/html; alias /usr/share/nginx/html/enterprise-admin/index.html; }

    # 统一去掉尾部斜杠。
    location ~ ^/(product|solutions|pricing|api|developers|apply)/$ { return 308 /$1$is_args$args; }
    location ~ ^/admin/(plan|usage|company|brand)/$ { return 308 /admin/$1$is_args$args; }
    location = /admin/ { return 308 /admin$is_args$args; }

    # 兼容历史链接，并永久跳转到新的规范 URL。
    location = /index.html { return 308 /$is_args$args; }
    location = /enterprise { return 308 /$is_args$args; }
    location = /enterprise/ { return 308 /$is_args$args; }
    location = /enterprise/index.html { return 308 /$is_args$args; }
    location ~ ^/enterprise/(product|solutions|pricing|api|developers|apply)/?$ { return 308 /$1$is_args$args; }
    location ~ ^/enterprise/admin/?$ { return 308 /admin$is_args$args; }
    location ~ ^/enterprise/admin/(plan|usage|company|brand)/?$ { return 308 /admin/$1$is_args$args; }
    location ~ ^/prototype-v4/assets/platform-logos/(.+)$ { return 308 /assets/platforms/$1$is_args$args; }
    location ~ ^/prototype-v4/assets/(.+)$ { return 308 /assets/$1$is_args$args; }
    location = /prototype-v4/styles.css { return 308 /assets/styles.css$is_args$args; }
    location = /prototype-v4/kjson-reference.js { return 308 /assets/kjson-reference.js$is_args$args; }
    location = /prototype-v4/kjson-reference.css { return 308 /assets/kjson-reference.css$is_args$args; }
    location = /prototype-v4/kjson-reference.html { return 308 /assets/kjson-reference.html$is_args$args; }
    location ~ ^/prototype-v4(?:/index\.html)?/?$ { return 308 /$is_args$args; }
    location ~ ^/enterprise-admin/?$ { return 308 /admin$is_args$args; }
    location = /enterprise-admin/index.html { return 308 /admin$is_args$args; }
    location = /enterprise-admin/styles.css { return 308 /assets/admin.css$is_args$args; }

    # 不做全局 SPA 兜底，错误 URL 保持 404。
    location / { return 404; }
}
